<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Aura Motion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f111a;
            --bg-surface: #161925;
            --bg-card: #1c2030;
            --accent: #5c6bc0;
            --accent-hover: #7986cb;
            --text-main: #e0e0e0;
            --text-dim: #9499b0;
            --border: #2d324a;
            --success: #4caf50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            height: 48px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 20px;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        input[type="text"],
        select,
        input[type="number"],
        input[type="range"],
        textarea {
            width: 100%;
            background-color: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-folder {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .btn-folder:hover {
            background-color: var(--border);
            color: var(--text-main);
        }

        .btn-folder.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-top {
            height: 60%;
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .upload-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .prompt-view {
            width: 350px;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-surface);
        }

        .section-results {
            height: 40%;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .gallery {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 10px 0;
        }

        .gallery-item {
            flex: 0 0 170px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-img {
            max-height: 80%;
            border-radius: 8px;
            display: none;
        }

        .drop-zone {
            width: 200px;
            height: 120px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.2s;
        }

        .drop-zone.drag-over {
            border-color: var(--accent);
            background: rgba(92, 107, 192, 0.15);
            color: var(--accent);
        }

        .motion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .motion-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            padding: 6px;
            background: var(--bg-card);
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-generate {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 32px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        #status-overlay {
            position: fixed;
            top: 60px;
            right: 20px;
            width: 320px;
            z-index: 1000;
        }

        .toast {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .prompt-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .prompt-card label {
            color: var(--accent);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        textarea {
            height: 80px;
            font-size: 11px;
            line-height: 1.4;
            resize: none;
            border: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .bottom-bar {
            height: 32px;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 11px;
            color: var(--text-dim);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="logo">🌀 Aura Motion</div>
        <div style="flex:1"></div>
        <div style="font-size:11px; color:var(--text-dim);">Blackwell Engine</div>
    </nav>
    <div class="workspace">
        <aside class="sidebar">
            <form id="mainForm">
                <div>
                    <div class="panel-title">캐릭터 설정</div>
                    <div class="form-group"><label>네이밍 ID</label><input type="text" name="char_name" id="char_name"
                            placeholder="Fighter_M" required></div>
                    <div class="form-group">
                        <label>직업군</label>
                        <select name="char_class" id="char_class" onchange="updateAllPrompts()">
                            {% for key, val in classes.items() %}
                            <option value="{{ key }}">{{ val.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <label>카테고리</label>
                    <div id="folder_presets" style="margin-bottom:10px; display:flex; gap:4px;">
                        <button type="button" class="btn-folder active" onclick="setCategory('PC')">PC</button>
                        <button type="button" class="btn-folder" onclick="setCategory('Monster')">Mon</button>
                        <button type="button" class="btn-folder" onclick="setCategory('NPC')">NPC</button>
                    </div>
                    <input type="hidden" name="root_path" id="root_path" value="C:/Git/ComfyUI/output/WAN/GE_SD/">
                    <input type="hidden" name="save_path" id="save_path">
                </div>
                <div>
                    <div class="panel-title">동작 선택</div>
                    <div class="motion-grid">
                        <label class="motion-item"><input type="checkbox" name="motions" value="idle" checked
                                onchange="togglePrompt('idle')"> Idle</label>
                        <label class="motion-item"><input type="checkbox" name="motions" value="attack" checked
                                onchange="togglePrompt('attack')"> Attack</label>
                        <label class="motion-item"><input type="checkbox" name="motions" value="skill" checked
                                onchange="togglePrompt('skill')"> Skill</label>
                        <label class="motion-item"><input type="checkbox" name="motions" value="run" checked
                                onchange="togglePrompt('run')"> Run</label>
                        <label class="motion-item"><input type="checkbox" name="motions" value="die" checked
                                onchange="togglePrompt('die')"> Die</label>
                    </div>
                    <div class="form-group" style="margin-top:16px;">
                        <label>재생 시간 <input type="number" name="duration" id="duration_input" step="0.1" value="1.2"
                                style="width:45px; padding:2px; font-size:10px; float:right;"></label>
                        <input type="range" id="duration_slider" min="0.5" max="3.0" step="0.1" value="1.2">
                    </div>
                    <div class="form-group">
                        <label>시안 제작 개수 (Variations)</label>
                        <input type="number" name="batch_count" value="2" min="1" max="4">
                        <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;">* 한 번에 생성할 동작 시안의 개수를
                            설정합니다.</div>
                    </div>
                </div>
                <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border);">
                    <div class="panel-title">로컬 저장소</div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="local_path_display" value="Downloads" readonly
                            style="font-size:10px; flex:1; background:rgba(0,0,0,0.2);">
                        <button type="button" class="btn-folder" id="btn_pick_folder">...</button>
                    </div>
                </div>
            </form>
        </aside>
        <div class="content-area">
            <div class="section-top">
                <div class="upload-view">
                    <input type="file" id="fileInput" accept="image/*">
                    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">이미지 업로드
                    </div>
                    <img id="preview" class="preview-img">
                    <button class="btn-generate" id="generateBtn">🎬 연산 시작</button>
                </div>
                <div class="prompt-view">
                    <div class="panel-title">Prompt Editor</div>
                    <div id="prompt_container"></div>
                </div>
            </div>
            <section class="section-results">
                <div class="panel-title">Results (Horizontal Scroll)</div>
                <div class="gallery" id="gallery">
                    <div style="padding:20px; color:var(--text-dim); font-size:11px;">대기 중...</div>
                </div>
            </section>
        </div>
    </div>
    <div id="status-overlay"></div>
    <footer class="bottom-bar">
        <div>🌀 Aura Motion</div>
        <div>v1.0.0</div>
    </footer>
    <script>
        const CLASS_MODS = {
            "warrior": "무거운 무기로 머리 위에서부터 바닥까지 크게 내리치는",
            "mage": "우아하게 지팡이를 휘두르는",
            "musketeer": "빠르게 조준하고 사격 후의 반동이 느껴지는",
            "martial_artist": "날카로운 하이킥과 펀치를 조합한"
        };
        const BASE_TEMPLATES = {
            "idle": "1초 길이의 자연스러운 대기 애니메이션. 방향: 왼쪽을 바라보는 옆모습. 캐릭터: [NAME]. 동작: 숨을 쉬듯 몸이 부드럽게 위아래로 들썩임, 0.5초 지점에 눈을 한 번 깜빡임. 마법 효과 없음. 깨끗한 2D 스타일.",
            "attack": "1.2초 길이의 강력한 [MOD] 공격 애니메이션. 방향: 왼쪽을 바라보는 옆모습. 이펙트 없음. 캐릭터: [NAME]. 동작: 빠르게 무기를 들어 올린 후 강하게 휘두르고 원래 자세로 복귀함. 깨끗한 2D 스타일.",
            "skill": "1.5초 길이의 영웅적인 스킬 포즈 애니메이션. 방향: 왼쪽을 바라보는 옆모습. 마법 효과 없음. 캐릭터: [NAME]. 동작: 무기를 머리 위로 높이 치켜들고 함성을 지른 후 잠시 멈췄다가 대기 자세로 돌아옴. 깨끗한 2D 스타일.",
            "run": "0.8초 길이의 역동적인 질주 애니메이션. 방향: 왼쪽을 향해 전력 질주함. 이펙트 없음. 캐릭터: [NAME]. 동작: 상체를 숙이고 무릎을 높이 들며 힘차게 달려감. 깨끗한 2D 스타일.",
            "die": "1.2초 길이의 사망 애니메이션. 방향: 왼쪽을 바라봄. 마법 효과 없음. 캐릭터: [NAME]. 동작: 힘을 잃고 무기를 떨어뜨리며 뒤로 쓰러짐, 마지막에는 움직임 없이 멈춤. 루프 안 됨. 깨끗한 2D 스타일."
        };

        function getPromptText(m, charClass, charName) {
            let tpl = BASE_TEMPLATES[m].replace('[NAME]', charName || 'Character');
            if (m === 'attack') tpl = tpl.replace('[MOD]', CLASS_MODS[charClass]);
            return tpl;
        }

        function updateAllPrompts() {
            const charName = document.getElementById('char_name').value;
            const charClass = document.getElementById('char_class').value;
            document.querySelectorAll('textarea[name^="prompt_"]').forEach(ta => {
                const m = ta.name.split('_')[1];
                ta.value = getPromptText(m, charClass, charName);
            });
        }
        document.getElementById('char_name').oninput = updateAllPrompts;

        function togglePrompt(m) {
            const container = document.getElementById('prompt_container');
            const charName = document.getElementById('char_name').value;
            const charClass = document.getElementById('char_class').value;
            if (document.querySelector(`input[value="${m}"]`).checked) {
                const div = document.createElement('div');
                div.className = 'prompt-card'; div.id = `card-${m}`;
                div.innerHTML = `<label>${m}</label><textarea name="prompt_${m}">${getPromptText(m, charClass, charName)}</textarea>`;
                container.appendChild(div);
            } else {
                const card = document.getElementById(`card-${m}`);
                if (card) card.remove();
            }
        }
        ['idle', 'attack', 'skill', 'run', 'die'].forEach(togglePrompt);

        // UI & API Logic
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const generateBtn = document.getElementById('generateBtn');
        const gallery = document.getElementById('gallery');
        const statusOverlay = document.getElementById('status-overlay');
        let dirHandle = null;

        function setCategory(cat) {
            document.querySelectorAll('.btn-folder').forEach(btn => { if (btn.id !== 'btn_pick_folder') btn.classList.toggle('active', btn.innerText.includes(cat)); });
            document.getElementById('save_path').value = document.getElementById('root_path').value + cat;
        }
        setCategory('PC');

        document.getElementById('btn_pick_folder').onclick = async () => { dirHandle = await window.showDirectoryPicker(); document.getElementById('local_path_display').value = dirHandle.name; };

        const durSlider = document.getElementById('duration_slider');
        const durInput = document.getElementById('duration_input');
        durSlider.oninput = () => durInput.value = durSlider.value;
        durInput.oninput = () => durSlider.value = durInput.value;

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; document.getElementById('dropZone').style.display = 'none'; };
            reader.readAsDataURL(file);
        }

        fileInput.onchange = (e) => {
            if (e.target.files[0]) loadImageFile(e.target.files[0]);
        };

        // Drag & Drop
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
                loadImageFile(file);
            }
        });

        function showToast(msg) {
            const toast = document.createElement('div'); toast.className = 'toast'; toast.innerHTML = msg;
            statusOverlay.appendChild(toast); setTimeout(() => toast.remove(), 5000);
        }

        generateBtn.onclick = async () => {
            const file = fileInput.files[0];
            const name = document.getElementById('char_name').value;
            if (!file || !name) { showToast("❌ 이미지와 ID를 확인해 주세요."); return; }
            generateBtn.disabled = true; generateBtn.innerHTML = '⚡ 연산 중...';
            const formData = new FormData(document.getElementById('mainForm'));
            formData.append('image', file);
            try {
                const res = await fetch('/generate', { method: 'POST', body: formData });
                const result = await res.json();
                if (result.status === 'Success') {
                    if (gallery.innerText.includes('대기 중')) gallery.innerHTML = '';
                    result.queued.forEach(item => {
                        const div = document.createElement('div'); div.className = 'gallery-item'; div.id = `item-${item.prompt_id}`;
                        div.innerHTML = `<div style="font-size:10px; font-weight:600; color:var(--accent); margin-bottom:5px;">${item.type.toUpperCase()} v${item.version}</div>
                            <div class="preview-box" style="width:140px; height:140px; background:#000; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#444;">Rendering...</div>
                            <button class="btn-save" style="display:none; width:100%; background:var(--accent); border:none; color:white; padding:6px; border-radius:4px; font-size:10px; font-weight:600; cursor:pointer; margin-top:8px;">💾 Save</button>`;
                        gallery.prepend(div);
                        checkStatus(item.prompt_id, `${name}_${item.type}_v${item.version}.gif`);
                    });
                }
            } catch (e) { showToast("❌ 서버 오류"); }
            finally { generateBtn.disabled = false; generateBtn.innerHTML = '🎬 연산 시작'; }
        };

        async function checkStatus(promptId, targetFilename) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/status/${promptId}`);
                    const data = await res.json();
                    if (data.status === 'Completed') {
                        clearInterval(interval);
                        const itemDiv = document.getElementById(`item-${promptId}`);
                        itemDiv.querySelector('.preview-box').innerHTML = `<img src="${data.url}" style="width:100%; height:100%; object-fit:contain;">`;
                        const saveBtn = itemDiv.querySelector('.btn-save');
                        saveBtn.style.display = 'block';
                        saveBtn.onclick = async () => {
                            if (dirHandle) {
                                try {
                                    const fileHandle = await dirHandle.getFileHandle(targetFilename, { create: true });
                                    const writable = await fileHandle.createWritable();
                                    const gifRes = await fetch(data.url);
                                    await writable.write(await gifRes.blob()); await writable.close();
                                    showToast(`✅ ${targetFilename} 저장 완료!`);
                                } catch (e) { window.location.href = `/proxy_download?url=${encodeURIComponent(data.url)}&filename=${encodeURIComponent(targetFilename)}`; }
                            } else { window.location.href = `/proxy_download?url=${encodeURIComponent(data.url)}&filename=${encodeURIComponent(targetFilename)}`; }
                        };
                    }
                } catch (e) { }
            }, 3000);
        }
    </script>
</body>

</html>
